name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lenso_usage_meter_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lenso_usage_meter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LENSO_POSTGRES_TEST_URL: postgres://postgres@127.0.0.1:5432/lenso_usage_meter_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
      - name: Install repository-boundary tools
        run: sudo apt-get update && sudo apt-get install --yes jq ripgrep
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - name: Install exact contract projection checker
        run: cargo install --locked --version '=0.6.5' lenso-contract-codegen
      - run: lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: cargo test --locked --workspace -- --include-ignored --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ./scripts/check-repository-boundary.sh
      - run: cargo package --locked -p lenso-capability-usage-meter
