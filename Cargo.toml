[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-usage-meter",
    "crates/lenso-usage-meter-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-usage-meter-plugin"
rust-version = "1.94"

[workspace.dependencies]
lenso = "0.5.0"
lenso-capability-secrets = "0.1.1"
lenso-contract-authoring = "0.1.1"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
